<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Dark Slate Tile Background -->
  <rect width="512" height="512" rx="128" fill="#020617"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#10b981" stroke-width="8" stroke-opacity="0.25"/>

  <!-- Shield Outer Silhouette -->
  <path d="M 256 96 C 320 96 384 112 384 112 C 384 272 340 370 256 416 C 172 370 128 272 128 112 C 128 112 192 96 256 96 Z"
        fill="url(#emeraldTeal)" />

  <!-- Shackle -->
  <path d="M 216 230 V 196 C 216 174 234 156 256 156 C 278 156 296 174 296 196 V 230"
        fill="none"
        stroke="#020617"
        stroke-width="24"
        stroke-linecap="round"/>

  <!-- Lock Body Cutout -->
  <rect x="196" y="224" width="120" height="100" rx="20" fill="#020617"/>

  <!-- Glowing Keyhole -->
  <circle cx="256" cy="264" r="14" fill="url(#shieldGlow)"/>
  <polygon points="248,272 264,272 268,300 244,300" fill="url(#shieldGlow)"/>
</svg>
